<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Water Landing Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Only beige background, logo, and big text -->
    <div style="background-color: #F5F5DC; width: 100%; height: 100vh; position: relative;">
        <!-- Charity Water logo at the top left -->
        <img src="img/cw_logo-2.png" alt="Charity Water Logo" class="logo">
        <!-- Big text below the logo -->
        <div class="big-text">
            <!-- Each word or phrase on its own line -->
            <span>Make</span><br>
            <span class="yellow-text">Change</span><br>
            <span>Visible,</span><br>
            <span>Right, at</span><br>
            <span>Your</span><br>
            <span class="yellow-text">Fingertips.</span>
        </div>
        <!-- Paragraph below the big text -->
        <p class="main-paragraph">
            WITH ONE CLICK, YOUR DONATION FUNDS CLEAN WATER PROJECTS--AND YOU'LL SEE THE REAL LIVES TRANSFORMED BY YOUR GIFT.
        </p>
        <!-- Blue button below the paragraph, centered -->
        <div class="button-container">
            <a href="#" class="blue-button">MAKE A DIFFERENCE</a>
        </div>
        <!-- Show the cropped image below the text -->
        <div class="photo-crop">
            <img src="img/cropped.png" alt="Charity Water Cropped Photo" class="main-photo">
        </div>
    </div>
</body>
</html>
