<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity Water Page</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <img src="img/cw_logo-2.png" alt="Charity Water Logo" class="logo">
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-image">
      <img src="img/charity.png" alt="Smiling woman with water container">
    </div>
    <div class="hero-content">
      <h2>
        More than a Need — A Human Right.<br>
        Difference Starts with <span class="highlight">YOU.</span>
      </h2>
      <p>Help families access clean water with a simple click — small donations, big change.</p>
      <a href="#" class="donate-button">DONATE</a>
      <p class="small-text">100% of public donations go directly to fund sustainable clean water projects.</p>
    </div>
  </section>
</body>
</html>
