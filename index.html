<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>charity: water x asu</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">⛲</span>
        <span class="brand__text">charity: water <span class="brand__x">x</span> asu</span>
      </div>

      <a class="btn btn--primary" href="#donate">Make an<br />impact</a>
    </div>
  </header>

  <!-- Hero -->
  <main>
    <section class="hero" aria-label="Clean water starts with you">
      <!-- Background image + overlay -->
      <div class="hero__bg" role="img" aria-label="Person collecting water"></div>
      <div class="hero__overlay"></div>

      <div class="container hero__content">
        <div class="hero__left">
          <h1 class="hero__title">Clean water<br />starts with you</h1>
          <p class="hero__subtitle">
            Make real impact through simple, meaningful donations
          </p>

          <!-- Donation card -->
          <div class="donate-card" id="donate">
            <p class="donate-card__label">Choose an amount to give</p>

            <div class="amount-grid">
              <button class="amount amount--active" type="button">$50 <span class="amount__small">USD</span></button>
              <button class="amount" type="button">$100 <span class="amount__small">USD</span></button>
              <button class="amount" type="button">$150 <span class="amount__small">USD</span></button>
              <button class="amount" type="button">$200 <span class="amount__small">USD</span></button>
              <button class="amount amount--wide" type="button">Other amount</button>
            </div>

            <button class="amount amount--ghost" type="button">
              Sponsor an entire water project
            </button>

            <button class="btn btn--give" type="button">GIVE</button>

            <p class="donate-card__links">
              <a href="#" class="link">Give by check or stock</a> •
              <a href="#" class="link">Donate crypto</a>
            </p>

            <p class="donate-card__note">
              It only takes <strong>$40</strong> to bring 1 person reliable access to the clean water they deserve.
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
