<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Charity: Water Landing Page</title>
  <!-- Link to the CSS file -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header section with logo and brand name -->
  <header>
    <img src="img/cw_logo.png" alt="Charity Water Logo" class="logo">
    <span class="brand-name">Charity: Water</span>
  </header>

  <!-- Main content area -->
  <main>
    <section class="hero">
      <!-- Left side: messaging and buttons -->
      <div class="hero-text">
        <h1>TAKE ACTION,<br>FUND CLEAN WATER,<br>WATCH LIVES CHANGE.</h1>
        <p>
          Take part in a global movement creating real, measurable impact. Your donation brings clean water — and you’ll see exactly where and how it helps those in need.
        </p>
        <div class="buttons">
          <a href="#" class="btn donate">Donate Now</a>
          <a href="#" class="btn learn">Learn More</a>
        </div>
      </div>
      <!-- Right side: images -->
      <div class="hero-images">
        <img src="img/4832_Ethiopia_2019_CG-.jpg" alt="Child drinking water" class="main-image">
        <img src="img/JS_20170803_2360.jpg" alt="Clean and dirty water glasses" class="circle-image">
      </div>
    </section>
  </main>
</body>
</html>
