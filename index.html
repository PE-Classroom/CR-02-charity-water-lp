<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drop to Deliver</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">

        <!-- Logo -->
        <div class="logo-section">
            <img src="img/water-can-transparent.png" alt="Charity Water Logo" class="logo">
            <p class="brand-name">charity: water</p>
        </div>

        <!-- Title -->
        <h1>DROP TO<br>DELIVER</h1>

        <!-- Subtitle -->
        <h2>Help Deliver Clean Water 🌍</h2>

        <!-- Main Illustration -->
        <div class="image-section">
            <img src="img/water-can-with-water.png" alt="Water can illustration">
        </div>

        <!-- Description -->
        <p class="description">
            Every drop you collect helps bring clean water to communities in need.
        </p>

        <!-- Button -->
        <a href="#" class="start-button">START GAME</a>

        <!-- Footer -->
        <p class="footer">
            Learn more at 
            <a href="#" class="footer-link">charitywater.org</a>
        </p>

    </div>

</body>
</html>
