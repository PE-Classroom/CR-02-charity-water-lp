<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Water Landing Page</title>
    <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <!-- Navigation Bar -->
            <nav class="navbar">
                    <img src="img/cw_logo-2.png" alt="Charity Water Logo" style="height:40px; width:auto;">
                </div>

                <ul class="nav-links" style="list-style:none; display:flex; gap:18px; margin:0; padding:0;">
                    <li><a href="#" style="text-decoration:none; color:var(--color-dark); font-weight:600;">Home</a></li>
                    <li><a href="#about" style="text-decoration:none; color:var(--color-dark);">About</a></li>
                    <li><a href="#impact" style="text-decoration:none; color:var(--color-dark);">Impact</a></li>
                    <li><a href="#donate" class="donate-btn">Donate</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- Hero Section: This is the main banner at the top of the page -->
            <section class="hero" role="banner">
                <div class="hero-inner">
                    <!-- Main headline -->
                    <h1 class="hero-title">Clean water that changes everything</h1>
                    <!-- Subheadline -->
                    <p class="hero-sub">Even the smallest amounts fuel life-changing impacts.</p>
                    <a href="#donate" class="btn-btn-accent">Give today</a>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>© Charity Water — Building a future where everyone has clean water.</p>
        </footer>

    </body>
</html>
